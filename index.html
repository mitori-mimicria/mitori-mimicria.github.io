<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>
/* 0.6.7 のアプリと更新のお知らせは、このページの #milleaf を開く。Milleaf の受け口へ送る（図鑑のページと分けた・10-08 本部 G044） */
if (location.hash === '#milleaf') location.replace('milleaf-store/' + location.search);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimicria</title>
<meta name="description" content="Mimicria — Mitori のサイト。デジタルのアート図鑑「Mimicria」。">
<meta property="og:title" content="Mimicria">
<meta property="og:description" content="An illustrated field guide of things that pretend to be people. By Mimicria — Mitori.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://mitori-mimicria.github.io/img/vol5_ja_960.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/mimicria_icon_64.png">
<link rel="apple-touch-icon" href="img/mimicria_icon_180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 図鑑の側（itch.io・Gumroad で使っている色と、表紙の金の罫） */
  --bg: #0b0b0c;
  --bg2: #141417;
  --fg: #d6d6d8;
  --mute: #8f8f95;
  --line: #2a2a2f;
  --gold: #b89a63;
  --link: #c9666b;

  --serif: 'Shippori Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
  --sans: system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', Meiryo, sans-serif;
  --gutter: clamp(16px, 4vw, 48px);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.8 var(--sans);
  line-break: strict; text-spacing-trim: normal; text-autospace: normal;
}
:lang(en) body, body:lang(en) { line-height: 1.6; }
::selection { background: var(--gold); color: var(--bg); }
img { display: block; max-width: 100%; height: auto; }
a { color: var(--link); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
em { font-style: normal; }
h1, h2, h3, p, dl, dd, ul { margin: 0; }
ul { padding: 0; list-style: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- 頭 ---------- */
.top { display: flex; align-items: center; gap: 24px; padding-top: 20px; padding-bottom: 20px; }
.mark { font: 700 22px/1 var(--serif); letter-spacing: 0.08em; color: var(--fg); text-decoration: none; margin-right: auto; }
.top nav { display: flex; gap: 20px; font-size: 14px; }
.top nav a { color: var(--fg); text-decoration: none; }
.top nav a:hover { color: var(--gold); }
.lang { position: relative; }
.lang-btn {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  background: none; border: 1px solid var(--line); border-radius: 4px; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer;
}
.lang-btn:hover, .lang-btn[aria-expanded="true"] { border-color: var(--mute); }
.lang-btn svg { width: 16px; height: 16px; }
.lang-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; min-width: 160px; padding: 6px;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}
.lang-pop[hidden] { display: none; }
.lang-pop button {
  display: block; width: 100%; padding: 8px 10px; text-align: left; background: none; border: 0; border-radius: 2px;
  color: var(--fg); font: inherit; font-size: 14px; cursor: pointer;
}
.lang-pop button:hover { background: var(--line); }
.lang-pop button[aria-current="true"] { color: var(--gold); }

/* ---------- はじめの一文 ---------- */
.intro { padding-top: 80px; padding-bottom: 56px; border-bottom: 1px solid var(--line); }
.intro p { max-width: 36em; font-size: clamp(18px, 2.2vw, 22px); line-height: 1.8; }
.intro .ai { margin-top: 12px; font-size: 13px; color: var(--mute); }

/* ---------- 新刊 ---------- */
.latest { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: end; padding-top: 72px; padding-bottom: 96px; }
.latest .cover { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55); }
.vol { font: 700 13px/1 var(--serif); letter-spacing: 0.18em; color: var(--gold); }
.latest h2 { word-break: auto-phrase; margin-top: 16px; font: 700 clamp(30px, 4.4vw, 46px)/1.3 var(--serif); letter-spacing: 0.04em; text-wrap: balance; }
.latest .genre { margin-top: 6px; font-family: var(--serif); color: var(--mute); letter-spacing: 0.12em; }
.catch { font-family: var(--serif); font-weight: 500; }
.latest .catch { margin-top: 32px; font-size: 20px; }
.latest .desc { margin-top: 10px; max-width: 34em; color: var(--fg); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 20px; margin-top: 24px; font-size: 14px; font-variant-numeric: tabular-nums; }
.facts dt { color: var(--mute); }
.stores { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 20px; font-size: 14px; }
.stores .ed { color: var(--mute); font-size: 12px; margin-left: 4px; }
.soon { margin-top: 20px; padding-left: 12px; border-left: 2px solid var(--gold); font-size: 14px; }

/* ---------- 既刊 ---------- */
.part { padding-top: 64px; padding-bottom: 96px; border-top: 1px solid var(--line); }
.part-head h2 { font: 700 clamp(22px, 2.6vw, 28px)/1.4 var(--serif); letter-spacing: 0.04em; }
.part-head p { margin-top: 4px; color: var(--mute); font-size: 14px; }
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px clamp(16px, 2.4vw, 32px); margin-top: 40px; }
.book .cover { aspect-ratio: 5 / 8; object-fit: cover; width: 100%; background: var(--bg2); }
.book .vol { display: block; margin-top: 18px; }
.book .catch { word-break: auto-phrase; margin-top: 10px; font-size: 16px; line-height: 1.6; }
.book .desc { margin-top: 8px; font-size: 13px; line-height: 1.75; color: var(--mute); }
.book .facts { margin-top: 12px; font-size: 13px; }
.book .stores { flex-direction: column; gap: 4px; margin-top: 12px; font-size: 13px; }

/* ---------- 奥付 ---------- */
.foot { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; padding-top: 32px; padding-bottom: 40px; font-size: 13px; color: var(--mute); }
.foot .credit { margin-right: auto; font-family: var(--serif); color: var(--fg); letter-spacing: 0.04em; }

@media (max-width: 860px) {
  .latest { grid-template-columns: 1fr; align-items: start; padding-top: 48px; padding-bottom: 72px; }
  .latest .cover { max-width: 300px; }
  .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .top { flex-wrap: wrap; gap: 12px 20px; }
  .top nav { order: 3; width: 100%; }
  .spec div { grid-template-columns: 6.5em 1fr; }
  .book .stores { gap: 0; }
  .book .stores li { padding: 6px 0; }
}
</style>
</head>
<body>

<header class="wrap top">
  <a class="mark" href="./">Mimicria</a>
  <nav>
    <a href="#books" data-t="nav.books">図鑑シリーズ</a>
  </nav>
  <div class="lang">
    <button class="lang-btn" type="button" aria-haspopup="true" aria-expanded="false" id="lang-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span id="lang-cur">日本語</span>
    </button>
    <div class="lang-pop" id="lang-pop" hidden></div>
  </div>
</header>

<main>

  <div id="books">
    <section class="wrap intro">
      <p data-t="intro">「人のふりをしているもの」を観察して記録する、デジタルのアート図鑑です。</p>
      <p class="ai" data-t="ai">生成AIを利用し、選定と加筆・修正を行って制作しています。</p>
    </section>
    <section class="wrap latest" id="latest"></section>
    <section class="wrap part" id="part1"></section>
  </div>

</main>

<footer class="wrap foot">
  <span class="credit">© Mimicria — Mitori</span>
  <a href="https://x.com/mitori_mimicria">X @mitori_mimicria</a>
  <a href="https://mitori-mimicria.booth.pm/">BOOTH</a>
  <a href="https://mimicria.gumroad.com/">Gumroad</a>
</footer>

<script>
(function () {
  'use strict';

  /* ---------- 言語（日本語と英語だけ・10-09 オーナー。Milleaf の受け口 milleaf-store/ は 5 言語のまま） ---------- */
  var LANGS = [
    { id: 'ja', label: '日本語' },
    { id: 'en', label: 'English' }
  ];
  var STORAGE_KEY = 'mimicria.lang';
  function isLang(v) { return LANGS.some(function (l) { return l.id === v; }); }
  function initialLang() {
    var q = new URLSearchParams(location.search).get('lang');
    if (q && isLang(q)) return q;
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if (v && isLang(v)) return v;
    } catch (e) { /* 保存できない環境 */ }
    var nav = (navigator.language || 'en').toLowerCase();
    if (nav.indexOf('ja') === 0) return 'ja';
    return 'en';
  }

  /* ---------- 文 ---------- */
  var T = {
    'nav.books': { ja: '図鑑シリーズ', en: 'Field guide series' },
    intro: {
      ja: '「人のふりをしているもの」を観察して記録する、デジタルのアート図鑑です。',
      en: 'An illustrated field guide of things that pretend to be people.'
    },
    ai: {
      ja: '生成AIを利用し、選定と加筆・修正を行って制作しています。',
      en: 'Made with generative AI, with selection, revision and correction by hand.'
    },
    pages: { ja: 'ページ数', en: 'Pages' },
    price: { ja: '価格', en: 'Price' },
    out: { ja: '配信日', en: 'Release' },
    edJa: { ja: '日本語版', en: 'Japanese edition' },
    edEn: { ja: '英語版', en: 'English edition' },
    kindleOnly: { ja: 'Kindle だけで配信します（日本語版・英語版）。', en: 'Kindle only (Japanese and English editions).' },
    v5date: { ja: '2026年10月10日', en: 'October 10, 2026' },
    part1: { ja: '第1部　鉱物と結晶の少女たち', en: 'Part 1: The Girls of Minerals & Crystals' },
    part1sub: { ja: '鉱物擬人化図鑑　vol. I〜IV', en: 'Minerals, personified. vol. I–IV' },
  };

  /* ---------- 図鑑のデータ（販路の URL が分かったら空欄を埋める） ---------- */
  var BOOTH = 'https://mitori-mimicria.booth.pm/items/';
  var BOOKS = [
    {
      n: 1, roman: 'I', pages: 14, yen: '¥300', usd: '$2.99',
      links: { booth: BOOTH + '8782794', kindleJa: 'https://www.amazon.co.jp/dp/B0HH9MWW29', kindleEn: 'https://www.amazon.com/dp/B0HHJYPC3Q', itch: 'https://mitori-mimicria.itch.io/mimicria-vol-1', gumroad: 'https://mimicria.gumroad.com/l/mimicria-vol-1' },
      catch: { ja: '結晶のかたちは、七つしかない。', en: 'There are only seven crystal systems.' },
      desc: {
        ja: '鉱物9種。鉱物学の7つの結晶系を一巡し、対称性の高いものから順に並んでいます。',
        en: 'Nine minerals covering all seven crystal systems, from the most symmetrical to the least.'
      }
    },
    {
      n: 2, roman: 'II', pages: 15, yen: '¥300', usd: '$2.99',
      links: { booth: BOOTH + '8808919', kindleJa: 'https://www.amazon.co.jp/dp/B0HHXWL3PL', kindleEn: 'https://www.amazon.com/dp/B0GY4PQRNR', itch: 'https://mitori-mimicria.itch.io/mimicria-vol-2', gumroad: 'https://mimicria.gumroad.com/l/mimicria-vol-2' },
      catch: { ja: '最後の一種は、生き物だった。', en: 'The last of them was once alive.' },
      desc: {
        ja: '鉱物10種。化学組成で分けるシュツルンツ分類の10クラスを一巡し、組成の単純なものから順に並んでいます。',
        en: 'Ten minerals covering all ten Nickel-Strunz classes, starting from the simplest compositions.'
      }
    },
    {
      n: 3, roman: 'III', pages: 14, yen: '¥300', usd: '$2.99',
      links: { booth: BOOTH + '8833456', kindleJa: 'https://www.amazon.co.jp/dp/B0HJLM1HRQ', kindleEn: 'https://www.amazon.com/dp/B0HJL3WV24', itch: 'https://mitori-mimicria.itch.io/mimicria-vol-3', gumroad: 'https://mimicria.gumroad.com/l/mimicria-vol-3' },
      catch: { ja: '当てた光は、そのまま返ってこない。', en: 'The light you give is not the light you get back.' },
      desc: {
        ja: '鉱物9種。石で見られる9つの光の現象を一巡し、似た現象どうしを隣に並べています。',
        en: 'Nine minerals covering nine optical effects seen in stones, with related effects placed side by side.'
      }
    },
    {
      n: 4, roman: 'IV', pages: 14, yen: '¥300', usd: '$2.99',
      links: { booth: BOOTH + '8906001', kindleJa: 'https://www.amazon.co.jp/dp/B0HL5Y2TP8', kindleEn: 'https://www.amazon.com/dp/B0HL5X3KGD', itch: 'https://mitori-mimicria.itch.io/mimicria-vol-4', gumroad: 'https://mimicria.gumroad.com/l/mimicria-vol-4' },
      catch: { ja: '石にも、生まれた場所がある。', en: 'Every stone has a place it came from.' },
      desc: {
        ja: '鉱物9種。石ができる9つの場所を一巡し、地球の深いところから地表へ、そして地球の外へと順に並んでいます。',
        en: 'Nine minerals covering nine places where stones form, from deep inside the Earth to the surface, and then beyond it.'
      }
    }
  ];
  var LATEST = {
    n: 5, roman: 'V', pages: 29, yen: '¥400', usd: '$3.99',
    release: '2026-10-10T00:00:00+09:00',
    links: { kindleJa: '', kindleEn: '' },
    title: { ja: '雲と大気の少女たち', other: 'The Girls of Clouds & Atmosphere' },
    genre: { ja: '気象擬人化図鑑', en: 'Weather, personified' },
    catch: { ja: '形を持たないものにも、名前がある。', en: 'Even what has no shape has a name.' },
    desc: {
      ja: '雲10種。国際分類の十種雲形を一巡し、高い雲から低い雲へ順に並んでいます。最後の2つは、下から湧き上がる積雲と積乱雲です。',
      en: 'Ten clouds covering all ten cloud genera, from the highest to the lowest. The last two, cumulus and cumulonimbus, build up from below.'
    }
  };
  /* ---------- 組み立て ---------- */
  var lang = 'ja';
  function t(key) { var v = T[key]; return v ? (v[lang] || v.en) : key; }
  function pick(o) { return o[lang] || o.en; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function cover(b, eager) {
    var ed = lang === 'ja' ? 'ja' : 'en';
    var img = el('img', 'cover');
    img.src = 'img/vol' + b.n + '_' + ed + '_480.jpg';
    img.srcset = 'img/vol' + b.n + '_' + ed + '_480.jpg 480w, img/vol' + b.n + '_' + ed + '_960.jpg 960w';
    img.sizes = eager ? '(max-width: 860px) 300px, 380px' : '(max-width: 860px) 45vw, 260px';
    img.width = 480; img.height = 768;
    if (!eager) img.loading = 'lazy';
    img.alt = 'Mimicria vol. ' + b.roman + ' ' + (lang === 'ja' ? (b.title ? b.title.ja : '鉱物と結晶の少女たち') : (b.title ? b.title.other : 'The Girls of Minerals & Crystals'));
    return img;
  }
  function facts(b, extra) {
    var dl = el('dl', 'facts');
    var rows = (extra || []).concat([[t('pages'), String(b.pages)], [t('price'), lang === 'ja' ? b.yen + ' / ' + b.usd : b.usd + ' / ' + b.yen]]);
    rows.forEach(function (r) { dl.appendChild(el('dt', null, r[0])); dl.appendChild(el('dd', null, r[1])); });
    return dl;
  }
  function stores(b) {
    var L = b.links, ja = [], en = [];
    if (L.booth) ja.push(['BOOTH', L.booth]);
    if (L.kindleJa) ja.push(['Kindle', L.kindleJa]);
    if (L.kindleEn) en.push(['Kindle', L.kindleEn]);
    if (L.itch) en.push(['itch.io', L.itch]);
    if (L.gumroad) en.push(['Gumroad', L.gumroad]);
    var list = (lang === 'ja' ? ja.map(tag('edJa')).concat(en.map(tag('edEn'))) : en.map(tag('edEn')).concat(ja.map(tag('edJa'))));
    var ul = el('ul', 'stores');
    list.forEach(function (s) {
      var li = el('li'), a = el('a', null, s[0]);
      a.href = s[1];
      li.appendChild(a); li.appendChild(el('span', 'ed', s[2]));
      ul.appendChild(li);
    });
    return ul;
  }
  function tag(k) { return function (s) { return [s[0], s[1], t(k)]; }; }

  function renderLatest() {
    var b = LATEST, root = document.getElementById('latest');
    root.textContent = '';
    root.appendChild(cover(b, true));
    var box = el('div');
    box.appendChild(el('p', 'vol', 'MIMICRIA vol. ' + b.roman));
    var h = el('h2', null, lang === 'ja' ? b.title.ja : b.title.other);
    if (lang !== 'ja') h.lang = 'en';
    box.appendChild(h);
    box.appendChild(el('p', 'genre', pick(b.genre)));
    box.appendChild(el('p', 'catch', pick(b.catch)));
    box.appendChild(el('p', 'desc', pick(b.desc)));
    box.appendChild(facts(b, [[t('out'), t('v5date')]]));
    if (b.links.kindleJa || b.links.kindleEn) box.appendChild(stores(b));
    else box.appendChild(el('p', 'soon', t('kindleOnly')));
    root.appendChild(box);
  }

  function renderPart1() {
    var root = document.getElementById('part1');
    root.textContent = '';
    var head = el('div', 'part-head');
    head.appendChild(el('h2', null, t('part1')));
    head.appendChild(el('p', null, t('part1sub')));
    root.appendChild(head);
    var shelf = el('div', 'shelf');
    BOOKS.forEach(function (b) {
      var art = el('article', 'book');
      art.appendChild(cover(b, false));
      art.appendChild(el('span', 'vol', 'vol. ' + b.roman));
      art.appendChild(el('p', 'catch', pick(b.catch)));
      art.appendChild(el('p', 'desc', pick(b.desc)));
      art.appendChild(facts(b));
      art.appendChild(stores(b));
      shelf.appendChild(art);
    });
    root.appendChild(shelf);
  }

  function apply(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = t(e.getAttribute('data-t')); });
    document.querySelectorAll('[data-alt]').forEach(function (e) { e.alt = t(e.getAttribute('data-alt')); });
    document.getElementById('lang-cur').textContent = LANGS.filter(function (x) { return x.id === l; })[0].label;
    renderLatest();
    renderPart1();
    buildMenu();
  }

  /* ---------- 言語のメニュー ---------- */
  var btn = document.getElementById('lang-btn'), pop = document.getElementById('lang-pop');
  function buildMenu() {
    pop.textContent = '';
    LANGS.forEach(function (l) {
      var b = el('button', null, l.label);
      b.type = 'button';
      b.lang = l.id;
      if (l.id === lang) b.setAttribute('aria-current', 'true');
      b.addEventListener('click', function () {
        try { localStorage.setItem(STORAGE_KEY, l.id); } catch (e) { /* 保存できない環境 */ }
        apply(l.id);
        close();
        btn.focus();
      });
      pop.appendChild(b);
    });
  }
  function open() { pop.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
  function close() { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function () { if (pop.hidden) open(); else close(); });
  window.addEventListener('pointerdown', function (e) { if (!pop.hidden && !e.target.closest('.lang')) close(); });
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) { close(); btn.focus(); } });

  apply(initialLang());
})();
</script>
</body>
</html>
